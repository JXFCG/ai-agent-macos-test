name: macOS Docker Compose Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests

      - name: 安装 Docker 环境 (Colima)
        run: |
          # 先安装 colima 和 docker
          brew install colima docker
          # 再删除可能存在的旧 Colima 实例（此时 colima 命令已可用）
          colima delete -f || true

          # 使用 QEMU 启动（更兼容，避免 VZ 的磁盘转换问题）
          echo "Starting Colima with QEMU (this may take a few minutes)..."
          colima start --cpu 4 --memory 8 --disk 50 --vm-type=qemu

          # 等待 Docker 守护进程就绪，最多尝试 60 次（每次 5 秒，共 300 秒）
          echo "Waiting for Docker to be ready..."
          for i in {1..60}; do
            if docker info >/dev/null 2>&1; then
              echo "Docker is ready"
              break
            fi
            echo "Attempt $i/60: Docker not ready, waiting 5s..."
            sleep 5
            if [ $i -eq 60 ]; then
              echo "Docker did not become ready in time."
              # 打印 Colima 日志帮助诊断
              colima logs || true
              if [ -f ~/.colima/_lima/colima/ha.stderr.log ]; then
                echo "===== ha.stderr.log ====="
                cat ~/.colima/_lima/colima/ha.stderr.log || true
              fi
              exit 1
            fi
          done

          docker version
          docker compose version

      - name: 启动 Docker Compose 服务
        run: docker compose up -d

      - name: 运行测试脚本
        run: python3 scripts/test_compose.py

      - name: 清理资源
        if: always()
        run: |
          if docker info >/dev/null 2>&1; then
            docker compose down -v
          else
            echo "Docker not available, skip cleanup."
          fi
